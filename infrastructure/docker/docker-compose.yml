version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ai_suite_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ai_suite_network

  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: ai_suite_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_NAME: "AI Conversation & Sales Suite"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:JqX9Rz8l4sE1aWvN2oP5tY7uI3kL6mO8=}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ai_suite}"
      DB_USERNAME: "${DB_USERNAME:-ai_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ai_secure_pass_2026}"
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: http://qdrant:6333
    volumes:
      - ../../backend/storage:/var/www/backend/storage
    depends_on:
      - mysql
      - redis
      - qdrant
    networks:
      - ai_suite_network

  queue_worker:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: ai_suite_queue_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90", "--sleep=3"]
    environment:
      APP_NAME: "AI Conversation & Sales Suite"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:JqX9Rz8l4sE1aWvN2oP5tY7uI3kL6mO8=}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ai_suite}"
      DB_USERNAME: "${DB_USERNAME:-ai_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ai_secure_pass_2026}"
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: http://qdrant:6333
    volumes:
      - ../../backend/storage:/var/www/backend/storage
    depends_on:
      - backend
      - redis
      - mysql
    networks:
      - ai_suite_network

  scheduler:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: ai_suite_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: "AI Conversation & Sales Suite"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:JqX9Rz8l4sE1aWvN2oP5tY7uI3kL6mO8=}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-ai_suite}"
      DB_USERNAME: "${DB_USERNAME:-ai_user}"
      DB_PASSWORD: "${DB_PASSWORD:-ai_secure_pass_2026}"
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend
      - redis
      - mysql
    networks:
      - ai_suite_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
    container_name: ai_suite_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    depends_on:
      - backend
    networks:
      - ai_suite_network

  mysql:
    image: mysql:8.0
    container_name: ai_suite_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-ai_suite}"
      MYSQL_USER: "${DB_USERNAME:-ai_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-ai_secure_pass_2026}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ai_suite_network

  redis:
    image: redis:alpine
    container_name: ai_suite_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_suite_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_suite_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_suite_network

volumes:
  mysql_data:
  redis_data:
  qdrant_data:

networks:
  ai_suite_network:
    driver: bridge
